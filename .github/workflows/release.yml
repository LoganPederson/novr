name: Release

# Push a version tag (0.4.5 or v0.4.5) to build NOVR.zip and both installers, and attach them with a
# signed SHA256SUMS.txt to a draft release. The installer checks the signature, then every download against it.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# Actions are pinned to full commit SHAs (tags can be moved); the comment shows the release each SHA is.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Verify native DLLs against pinned hashes
        run: ./tools/Verify-NativeDlls.ps1

      - name: Require game reference assemblies
        if: ${{ vars.GAME_REFS_REPO == '' }}
        run: throw "Set the GAME_REFS_REPO variable and GAME_REFS_SSH_KEY secret (a read-only deploy key for that repo); see tools/Export-GameReferences.ps1."

      - name: Check out game reference assemblies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.GAME_REFS_REPO }}
          ssh-key: ${{ secrets.GAME_REFS_SSH_KEY }}
          path: game-refs
          persist-credentials: false

      # The tag arrives through an environment variable rather than being pasted into the script, so a
      # crafted tag name can't inject PowerShell.
      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          # BepInEx parses the plugin version with System.Version, so it must be purely numeric.
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like 1.2.3 or v1.2.3" }
          $propsVersion = ([xml](Get-Content NOVR.Build/NOVR.Build.props)).Project.PropertyGroup.NovrVersion.'#text'
          if ($propsVersion -ne $version) {
            echo "::warning::Tag $version differs from NovrVersion $propsVersion in NOVR.Build.props; building as $version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build NuclearOptionVirtualRealityMod.sln -c Release -p:NovrVersion=$env:VERSION -p:NuclearOptionGameDir="${{ github.workspace }}\game-refs"

      - name: Check the release zip has no dev-only content
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead("dist/NOVR.zip")
          $bad = $zip.Entries | Where-Object { $_.FullName -match 'McpBridge' }
          $zip.Dispose()
          if ($bad) { throw "NOVR.zip contains dev-only files: $($bad.FullName -join ', ')" }

      - name: Write SHA256SUMS.txt
        run: |
          $files = 'NOVR.zip', 'NOVR.Installer-Win.exe', 'NOVR.Installer-Linux'
          $lines = foreach ($file in $files) {
            "{0}  {1}" -f (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLowerInvariant(), $file
          }
          [IO.File]::WriteAllLines("$PWD/dist/SHA256SUMS.txt", $lines)
          Get-Content dist/SHA256SUMS.txt

      # Sign the checksum list with the release key (OpenPGP, detached, armored). The installer only trusts a
      # SHA256SUMS.txt whose signature verifies against the public key built into it. The signature is then
      # checked in a fresh keyring holding only RELEASE-SIGNING-KEY.asc from the repo, so a wrong or empty secret
      # fails here instead of producing a release the installer would reject.
      - name: Sign SHA256SUMS.txt
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "::error::RELEASE_SIGNING_KEY secret is empty"; exit 1; fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg-sign"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$RELEASE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --armor --detach-sign --output dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt
          export GNUPGHOME="$RUNNER_TEMP/gnupg-verify"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          gpg --batch --import RELEASE-SIGNING-KEY.asc
          gpg --batch --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          gh release create "$env:TAG"
          dist/NOVR.zip dist/NOVR.Installer-Win.exe dist/NOVR.Installer-Linux dist/SHA256SUMS.txt dist/SHA256SUMS.txt.asc RELEASE-SIGNING-KEY.asc
          --draft --generate-notes --title "NOVR $env:VERSION"
